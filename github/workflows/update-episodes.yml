name: Maloney-Folgen aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4
      - name: Folgen von Roger Graf und SRF aktualisieren
        run: python tools/update_episodes.py
      - name: Änderungen speichern
        run: |
          if git diff --quiet episodes.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          git commit -m "Folgenliste automatisch aktualisieren"
          git push
