name: YouTube Maloney aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"

permissions:
  contents: write

concurrency:
  group: maloney-youtube-manifest
  cancel-in-progress: true

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests

      - name: Michael-Schacht-Kanal prüfen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python tools/update_youtube_michael_schacht.py \
            --episodes episodes.json \
            --output youtube.json

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- youtube.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          git commit -m "Update Michael Schacht YouTube sources"
          git push
