<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maloney" />
  <title>Maloney – Hörtracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=6" />
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">PHILIP MALONEY</div><h1>Hörtracker</h1></div>
    <button id="randomBtn" class="icon-btn" title="Zufälliger Fall">🎲</button>
  </header>

  <main>
    <section class="hero card">
      <div class="progress-copy"><strong id="progressText">0 / 0 gehört</strong><span id="progressPct">0 %</span></div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <div class="stats"><div><b id="openCount">0</b><span>offen</span></div><div><b id="heardCount">0</b><span>gehört</span></div><div><b id="favCount">0</b><span>Favoriten</span></div></div>
    </section>

    <section class="controls">
      <input id="searchInput" type="search" placeholder="Folge suchen …" autocomplete="off" />
      <select id="statusFilter" aria-label="Status filtern">
        <option value="all">Alle</option><option value="open">Noch nicht gehört</option><option value="heard">Gehört</option><option value="fav">Favoriten</option>
        <option value="direct">Direkt abspielbar</option><option value="private">Privates Audio</option><option value="youtube">YouTube</option>
      </select>
      <select id="yearFilter" aria-label="Jahr filtern"><option value="all">Alle Jahre</option></select>
    </section>

    <div id="dataStatus" class="data-status">Folgenliste wird geladen …</div>
    <section id="nextCase" class="card next-case"></section>
    <section id="episodeList" class="episode-list"></section>

    <section class="card tools">
      <h2>Daten</h2>
      <div class="tool-row"><button id="exportBtn">Export</button><label class="buttonlike">Import<input id="importInput" type="file" accept="application/json,.json" hidden /></label><button id="resetBtn" class="danger">Zurücksetzen</button></div>
      <p class="muted">Der Hörfortschritt wird nur auf diesem Gerät gespeichert. Exportiere gelegentlich ein Backup.</p>
    </section>
  </main>

  <dialog id="episodeDialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Schliessen">✕</button>
      <div class="eyebrow" id="dialogMeta"></div><h2 id="dialogTitle"></h2>
      <div id="dialogSources" class="source-selector"></div>
      <div id="dialogPlayer" class="dialog-audio"></div>
      <div id="dialogLinks" class="dialog-links"></div>
      <label class="checkline"><input id="dialogHeard" type="checkbox" /> Gehört</label>
      <label>Gehört am<input id="dialogDate" type="date" /></label>
      <label>Bewertung<select id="dialogRating"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Notizen<textarea id="dialogNotes" rows="4" placeholder="Eigene Notizen …"></textarea></label>
      <label class="checkline"><input id="dialogFav" type="checkbox" /> Favorit</label>
      <button id="dialogSave" value="default" class="save-btn">Speichern</button>
    </form>
  </dialog>

  <script src="./config.js?v=6"></script>
  <script src="./app.js?v=6"></script>
</body>
</html>
